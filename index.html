<!doctype html>
<!--
  ╔══════════════════════════════════════════════════════════════════════════════╗
  ║  « Page composée » : widget personnalisé Grist                      ║
  ╚══════════════════════════════════════════════════════════════════════════════╝
  Affiche sur une seule page, condensée et lisible, plusieurs vues natives d'un
  document Grist (tableaux, fiches, listes de fiches, graphiques natifs et avancés,
  cartes, listes déroulantes). Le widget ne copie rien : il RELIT la configuration
  des vues Grist (tables de métadonnées _grist_*) et en reproduit le rendu.

  Fichier unique : HTML + CSS + JavaScript, sans étape de construction.
  Hébergement : GitHub Pages, à côté de qpv-bretagne.geojson (couche QPV).
  Accès requis dans Grist : « Accès complet au document ».

  Plan du fichier
    1. <style>   mise en page (grille de 6 colonnes), blocs, tableaux, fiches,
                 cartes, panneau de configuration, impression.
    2. <body>    en-tête (menu des pages, barre d'outils, listes de sélection),
                 grille des blocs, panneau de configuration.
    3. <script>  voir le sommaire en tête du script.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GriSco – Page composée</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"
      integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG"
      crossorigin="anonymous"
    ></script>
    <style>
      @font-face {
        font-family: "Marianne";
        font-weight: 400;
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/gh/betagouv/beta.gouv.fr@master/assets/fonts/Marianne-Regular.woff")
          format("woff");
      }
      @font-face {
        font-family: "Marianne";
        font-weight: 700;
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/fonts/Marianne-Bold.woff2") format("woff2");
      }

      :root {
        --bleu: #000091;
        --bleu-clair: #e3e3fd;
        --bleu-hover: #f0f0ff;
        --texte: #161616;
        --muet: #666;
        --bord: #ddd;
        --fond: #f6f6f6;
        --carte: #fff;
        --rouge: #ce0500;
        --gap: 10px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 8px;
        background: #fff;
        color: var(--texte);
        font:
          13px/1.4 "Marianne",
          Arial,
          sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      /* Haut du widget toujours visible : titre, boutons, listes de sélection */
      /* Menu de navigation entre pages (style onglets DSFR) */
      #pnav {
        display: flex;
        flex-wrap: wrap;
        gap: 0 2px;
        margin: 0 0 8px;
        border-bottom: 1px solid var(--bord);
      }
      #pnav:empty {
        display: none;
      }
      #pnav a {
        padding: 6px 12px;
        font-size: 14px;
        color: #161616;
        text-decoration: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      #pnav a:hover {
        background: #f6f6f6;
      }
      #pnav a.cur {
        color: var(--bleu);
        border-bottom-color: var(--bleu);
        font-weight: 700;
      }
      .mn {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 4px 0;
        border-bottom: 1px solid #eee;
        font-size: 12px;
      }
      #top {
        position: sticky;
        top: 0;
        z-index: 12;
        background: #fff;
        margin: -8px -8px 8px;
        padding: 8px 8px 2px;
        border-bottom: 1px solid transparent;
      }
      #top.notitle .bar {
        position: absolute;
        top: 8px;
        right: 8px;
        margin: 0;
        z-index: 1;
      }
      #top.notitle .bar h1,
      #top.notitle .bar .spacer {
        display: none;
      }
      #top.notitle #pnav,
      #top.notitle #filters {
        padding-right: calc(var(--barw, 230px) + 12px);
      }
      /* la barre d'outils n'occupe que la première rangée : sous le menu des pages, les listes prennent toute la largeur */
      #top.notitle #pnav:not(:empty) ~ #filters {
        padding-right: 0;
      }
      @media (max-width: 760px) {
        #top.notitle .bar {
          position: static;
          justify-content: flex-end;
          margin-bottom: 6px;
        }
        #top.notitle #pnav,
        #top.notitle #filters {
          padding-right: 0;
        }
      }
      #lybar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 6px 10px;
        margin: 0 0 8px;
        background: var(--bleu-hover);
        border: 1px solid #b7b7f5;
        border-radius: 4px;
        font-size: 12.5px;
      }
      #lybar[hidden] {
        display: none;
      }
      #lybar .spacer {
        flex: 1;
      }
      .grid.layout > .block {
        outline: 2px dashed #b7b7f5;
        outline-offset: -2px;
        position: relative !important;
        top: auto !important;
        overflow: hidden !important;
        max-height: none !important;
        align-self: start !important;
      }
      .grid.layout > .block .bh {
        cursor: grab;
        background: var(--bleu-hover);
      }
      /* en disposition, chaque bloc montre un aperçu de hauteur fixe : aucun débordement sur les voisins */
      .grid.layout > .block > .bb {
        pointer-events: none;
        opacity: 0.75;
        display: block !important;
        height: 150px !important;
        max-height: 150px !important;
        min-height: 0 !important;
        overflow: hidden !important;
        flex: none !important;
      }
      .grid.layout > .block.collapsed > .bb {
        display: none !important;
      }
      .grid.layout > .block.tall > .bb {
        height: var(--lyh, 150px) !important;
        max-height: var(--lyh, 150px) !important;
      }
      .grid.layout > .block.dragging {
        opacity: 0.4;
      }
      .grid.layout > .block.drop-before {
        box-shadow: -4px 0 0 0 var(--bleu);
      }
      .grid.layout > .block.drop-after {
        box-shadow: 4px 0 0 0 var(--bleu);
      }
      .lyr {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        z-index: 3;
        background: linear-gradient(135deg, transparent 50%, var(--bleu) 50%);
        border-bottom-right-radius: 2px;
      }
      .lysize {
        position: absolute;
        right: 22px;
        bottom: 2px;
        font-size: 11px;
        background: var(--bleu);
        color: #fff;
        padding: 0 5px;
        border-radius: 3px;
        z-index: 3;
      }
      #top.stuck {
        border-bottom-color: var(--bord);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      }
      .bar h1 {
        font-size: 16px;
        margin: 0;
        color: var(--bleu);
      }
      .bar .spacer {
        flex: 1;
      }
      /* barre d'outils : icône + texte ; texte masqué sur écran réduit (infobulle) */
      .tb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--bord);
        border-radius: 4px;
        background: #fff;
        color: var(--bleu);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tb:hover {
        background: var(--bleu-hover);
        border-color: #b7b7f5;
      }
      .tb:focus-visible {
        outline: 2px solid #0a76f6;
        outline-offset: 2px;
      }
      .tb[hidden] {
        display: none;
      }
      .tb svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (max-width: 900px) {
        .tb .lbl {
          display: none;
        }
        .tb {
          padding: 0 7px;
        }
      }
      .icon-btn {
        border: 1px solid var(--bord);
        background: var(--carte);
        border-radius: 4px;
        padding: 2px 8px;
        color: var(--bleu);
      }
      .icon-btn:hover {
        background: var(--bleu-hover);
      }
      #status {
        color: var(--muet);
        padding: 4px 2px;
      }
      #status.err {
        color: var(--rouge);
      }
      #status:empty {
        display: none;
      }
      #filters {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 8px 24px;
        margin: 0 0 14px;
        padding: 0;
      }
      #filters:empty {
        display: none;
      }
      /* Listes au style DSFR (fr-label / fr-select) */
      #filters label {
        display: flex;
        flex-direction: column;
        font-size: 11px;
        line-height: 1.2;
        color: var(--muet);
        gap: 2px;
      }
      #filters select {
        appearance: none;
        -webkit-appearance: none;
        font: inherit;
        font-size: 14px;
        line-height: 1.5;
        color: #3a3a3a;
        min-width: 160px;
        max-width: 100%;
        padding: 6px 40px 6px 12px;
        border: 0;
        border-radius: 4px 4px 0 0;
        background-color: #eee;
        box-shadow: inset 0 -2px 0 0 #3a3a3a;
        cursor: pointer;
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23161616' d='m12 13.1 5-4.9 1.4 1.4-6.4 6.3-6.4-6.4L7 8.1l5 5z'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: calc(100% - 12px) 50%;
        background-size: 16px 16px;
      }
      #filters select:hover {
        background-color: #ddd;
      }
      #filters select:focus {
        outline: 2px solid #0a76f6;
        outline-offset: 2px;
      }
      #filters optgroup {
        font-weight: 700;
        color: #161616;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: var(--gap);
        align-items: start;
      }
      .grid.dense {
        grid-auto-flow: row dense;
      }
      /* Empilement sans trous : chaque bloc occupe exactement sa hauteur, la colonne voisine n'impose plus la sienne */
      .grid.masonry {
        grid-auto-rows: 2px;
        row-gap: 0;
      }
      .grid.masonry > .block {
        align-self: start !important;
        margin-bottom: var(--gap);
      }
      /* Mode ultracompact : flux de blocs ajustés au contenu */
      .grid.flux {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .brk {
        flex-basis: 100%;
        height: 0;
      }
      .flux table {
        width: auto;
        font-size: 12px;
      }
      .flux th,
      .flux td {
        padding: 2px 6px;
      }
      .flux td {
        max-width: 220px;
      }
      #tip {
        position: fixed;
        z-index: 20;
        display: none;
        background: #161616;
        color: #fff;
        font-size: 12px;
        line-height: 1.35;
        padding: 4px 8px;
        border-radius: 4px;
        max-width: min(420px, calc(100vw - 8px));
        pointer-events: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      #tip.on {
        display: block;
      }
      #tip {
        white-space: pre-line;
      }
      .info {
        color: var(--bleu);
        font-size: 10px;
        margin-left: 3px;
        cursor: help;
        font-weight: 400;
      }
      /* écran étroit (téléphone) : un bloc par ligne, empilés, sans empilement « sans trous » ni blocs figés */
      @media (max-width: 760px) {
        .grid > * {
          grid-column: 1 / -1 !important;
          grid-row: auto !important;
        }
        .grid.masonry {
          grid-auto-rows: auto !important;
          row-gap: var(--gap) !important;
        }
        .grid.masonry > .block {
          margin-bottom: 0 !important;
        }
        .grid.flux > * {
          flex: 1 1 100% !important;
          width: 100% !important;
          max-width: 100% !important;
        }
        .block.sticky {
          position: static !important;
          max-height: none !important;
          overflow: hidden !important;
        }
      }

      .block {
        background: #fff;
        border: 0;
        overflow: hidden;
      }
      .bh {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 2px;
        border-bottom: 1px solid var(--bord);
        min-height: 30px;
      }
      .bh h2 {
        font-size: 13.5px;
        font-weight: 700;
        margin: 0;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bh .tog {
        border: 0;
        background: none;
        color: var(--bleu);
        padding: 0;
        width: 26px;
        height: 26px;
        font-size: 20px;
        line-height: 1;
        border-radius: 4px;
        flex: 0 0 auto;
      }
      .bh .tog:hover {
        background: var(--bleu-hover);
      }
      .badge {
        font-size: 11px;
        color: var(--muet);
        white-space: nowrap;
      }
      .bh .search {
        width: 120px;
        font: inherit;
        font-size: 12px;
        padding: 1px 6px;
        border: 1px solid var(--bord);
        border-radius: 3px;
      }
      /* Bloc « figé » : reste visible pendant que l'on fait défiler un bloc voisin très haut */
      .block.sticky {
        position: sticky;
        top: calc(var(--toph, 0px) + 6px);
        align-self: start !important;
        z-index: 2;
        max-height: calc(100vh - var(--toph, 0px) - 14px);
        overflow: auto;
      }
      .block.collapsed > .bb {
        display: none !important;
      }
      .grid:not(.masonry) > .block.collapsed {
        grid-row: auto !important;
        align-self: start !important;
      }
      .grid.masonry > .block.collapsed {
        align-self: start !important;
      } /* un bloc replié libère sa hauteur */
      .block.collapsed .bh {
        border-bottom: 0;
        background: var(--bleu-hover);
        border-left: 3px solid var(--bleu);
        border-radius: 3px;
        cursor: pointer;
        padding-left: 6px;
      }
      .block.collapsed .bh:hover {
        background: var(--bleu-clair);
      }
      .block.collapsed .bh h2 {
        color: var(--bleu);
      }
      .block.collapsed .bh .badge::after {
        content: "Afficher ▸";
        font-size: 11px;
        color: var(--bleu);
      }
      .block.empty .bb {
        color: var(--muet);
        padding: 6px 10px;
        font-style: italic;
      }
      .bb.pad {
        padding: 4px 8px;
      }
      /* Un bloc étalé sur plusieurs lignes remplit toute sa hauteur */
      .block.tall {
        display: flex;
        flex-direction: column;
      }
      .block.tall > .bb {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .block.tall > .bb > .chart-box,
      .block.tall > .bb > .plot-box {
        flex: none;
        height: calc(var(--h, var(--ch, 260px)) * var(--rows, 1) + (var(--rows, 1) - 1) * 40px);
      }
      .block.tall > .bb > .map-box {
        flex: none;
        height: calc(var(--h, 320px) * var(--rows, 1) + (var(--rows, 1) - 1) * 40px);
      }
      .block.tall > .bb > .tbl-wrap {
        flex: 1 1 auto;
        max-height: none !important;
      }
      /* Plein écran d'un bloc */
      .bh .max {
        border: 0;
        background: none;
        color: var(--muet);
        padding: 0 2px;
        font-size: 13px;
        line-height: 1;
      }
      .bh .max:hover {
        color: var(--bleu);
      }
      #backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 14;
        display: none;
      }
      #backdrop.on {
        display: block;
      }
      .block.maxed {
        position: fixed !important;
        inset: 10px;
        border-radius: 6px;
        padding: 0 8px 8px;
        z-index: 15;
        display: flex;
        flex-direction: column;
        width: auto !important;
        max-width: none !important;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      }
      /* en mode empilé (masonry), les blocs ont align-self:start, qui empêcherait le bloc agrandi de s'étirer sur l'écran */
      .grid > .block.maxed {
        align-self: stretch !important;
        justify-self: stretch !important;
        margin: 0 !important;
      }
      .block.maxed > .bb {
        flex: 1 1 auto;
        min-height: 0;
        display: flex !important;
        flex-direction: column;
        overflow: auto;
      }
      .block.maxed > .bb > .chart-box,
      .block.maxed > .bb > .plot-box,
      .block.maxed > .bb > .map-box {
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
      }
      .block.maxed > .bb > .tbl-wrap {
        flex: 1 1 auto;
        max-height: none !important;
      }
      .block.maxed td {
        max-width: 420px;
      }
      .msg {
        color: var(--muet);
        padding: 6px 10px;
        font-style: italic;
      }
      .msg.err {
        color: var(--rouge);
        font-style: normal;
      }

      /* Tableaux */
      .tbl-wrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12.5px;
      }
      th {
        position: sticky;
        top: 0;
        background: #f0f0f0;
        text-align: center;
        font-weight: 700;
        padding: 4px 6px;
        border-bottom: 1px solid var(--bord);
        white-space: normal;
        overflow-wrap: normal;
        line-height: 1.25;
        vertical-align: middle;
      }
      td {
        padding: 3px 8px;
        border-bottom: 1px solid #eee;
        max-width: 280px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table.zebra tbody tr:nth-child(even) td {
        background: #f5f5f5;
      }
      table.nohgrid td {
        border-bottom-color: transparent;
      }
      table.vgrid td,
      table.vgrid th {
        border-right: 1px solid #eee;
      }
      table.vgrid td:last-child,
      table.vgrid th:last-child {
        border-right: 0;
      }
      td.frz,
      th.frz {
        position: sticky;
        z-index: 1;
        background: #fff;
        box-shadow: inset -1px 0 0 var(--bord);
      }
      th.frz {
        z-index: 3;
        background: #f0f0f0;
      }
      table.zebra tbody tr:nth-child(even) td.frz {
        background: #f5f5f5;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover td {
        background: var(--bleu-hover);
      }
      /* ligne sélectionnée : un simple trait bleu en bas */
      tbody tr.sel td {
        box-shadow: inset 0 -2px 0 var(--bleu);
      }
      /* références multiples / listes de choix : une valeur par ligne, chacune tronquée si besoin */
      td.multi {
        white-space: normal;
      }
      td.multi .chip {
        display: block;
        width: fit-content;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin: 1px 0;
      }
      .fiche dd.styled {
        padding: 0 4px;
        border-radius: 3px;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .more {
        color: var(--muet);
        font-size: 11.5px;
        padding: 4px 8px;
      }

      /* Fiches */
      .fiche {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin: 0;
      }
      .fiche > div {
        flex: 1 1 auto;
        min-width: 80px;
        max-width: 100%;
      }
      .fiche > div.long {
        flex-basis: 100%;
      }
      .fiche.lay {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .fiche .lv {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .fiche .lh {
        display: flex;
        gap: 6px 18px;
        min-width: 0;
      }
      .fiche .lh > * {
        flex: 1 1 0;
        min-width: 0;
      }
      .fiche .lh.wrap {
        flex-wrap: wrap;
      }
      .fiche .lh.wrap > * {
        flex: 1 1 auto;
      }
      .fiche.lay > div,
      .fiche .lv > div {
        flex: 0 0 auto;
        max-width: none;
      }
      .fiche .lh > div.long {
        flex: 1 1 0;
      }
      .fiche dt {
        font-size: 11px;
        color: var(--muet);
      }
      .fiche dd {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .fiche dd.num {
        font-variant-numeric: tabular-nums;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11.5px;
        color: var(--muet);
      }
      .nav button {
        border: 1px solid var(--bord);
        background: var(--carte);
        border-radius: 3px;
        padding: 0 6px;
        color: var(--bleu);
      }
      .cartes {
        display: grid;

      /* Pastilles */
      /* Lien vers la fiche d'un enregistrement référencé (comme le maillon de Grist) */
      .rlink {

      td[data-kind="sel"][data-ed]:hover,
      dd[data-kind="sel"][data-ed]:hover {
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23000091' d='m12 13.1 5-4.9 1.4 1.4-6.4 6.3-6.4-6.4L7 8.1l5 5z'/%3E%3C/svg%3E");

        background-position: right 2px center;

      td[data-kind="sel"][data-ed],
      dd[data-kind="sel"][data-ed] {
        padding-right: 18px;

      #rcBack {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 25;
        display: none;
      }
      #rcBack.on {
        display: block;
      }
      #rc {
        position: fixed;
        z-index: 26;
        top: 50%;
        left: 50%;

        background: #fff;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);

      #rc.on {

      }
      #rc .rch {
        position: sticky;

      #rc .rch h3 {

      #rc .rch small {

        font-weight: 400;
      }
      #rc .rcb {
        padding: 10px 12px;
      }
      /* Édition des champs */
      [data-ed] {
        cursor: text;
      }
      /* champ éditable survolé : fond de la cellule teinté */
      [data-ed]:hover {
        background-color: #dde3fb !important;
      }
      .fiche dd[data-ed]:hover {
        border-radius: 3px;
      }
      .fiche dd[data-ed]:empty::after,
      td[data-ed]:empty::after {

      }
      .ed-input {
        font: inherit;

        background: #fff;
        color: var(--texte);
      }
      textarea.ed-input {
        min-height: 60px;
        resize: vertical;
      }
      .saving {
        opacity: 0.5;
      }
      .picker {
        position: fixed;
        z-index: 28;
        background: #fff;

      }
      .picker ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        max-height: 240px;
        overflow: auto;
      }
      .picker li {
        padding: 4px 8px;
        cursor: pointer;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
      }
      .picker li.on {
        background: var(--bleu-clair);
      }
      .picker li:not(.pk-none):hover {
        background: var(--bleu-clair);
      }
      .picker li.cur {
        font-weight: 700;
      }
      .picker .pk-empty,
      .picker .pk-none {
        color: var(--muet);
        font-style: italic;
      }
      .picker.multi li {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .picker.multi li input {
        margin: 0;
        pointer-events: none;
      }
      .picker .pk-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 6px;
      }
      .picker .pk-count {
        flex: 1;
        color: var(--muet);
        font-size: 12px;
      }
      .chip {
        display: inline-block;
        padding: 0 6px;
        border-radius: 10px;
        background: #eee;
        font-size: 11.5px;
        margin: 0 2px 1px 0;
      }
      .ok {
        color: #18753c;
      }
      .ko {
        color: #bbb;
      }

      /* Graphiques */
      .chart-box {
        position: relative;
        height: var(--h, var(--ch, 260px));
        padding: 6px 8px;
      }
      /* Plotly prend la taille de la boîte, marge intérieure comprise : sans marge ni débordement, aucun ascenseur parasite */
      .plot-box {
        height: var(--h, var(--ch, 260px));
        padding: 0;
        overflow: hidden;
      }
      .chart-box {
        overflow: hidden;
      }
      .map-box {
        height: var(--h, 320px);
        z-index: 0;
      }
      .leaflet-container {
        font: inherit;
        font-size: 12px;
      }
      .qpvinfo {

      .map-legend {

      /* Panneau de configuration */
      #config {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);

      .panel {
        width: max(50vw, min(560px, 100%));

      }

        border-bottom: 1px dotted #999;
      }
      .panel select,
      .panel input[type="number"],
      .panel input[type="text"] {
        font: inherit;
        padding: 2px 4px;

      .phead {

        letter-spacing: 0.03em;
        margin-bottom: 4px;
      }
      .pfix .preview {
        max-height: 28vh;
        overflow: auto;
      }
      .pbody {
        flex: 1;
        overflow: auto;
        padding: 12px 16px 24px;
      }
      .cs {
        background: var(--carte);
        border: 1px solid var(--bord);
        border-left: 4px solid var(--bleu);
        border-radius: 6px;
        padding: 8px 12px 10px;
        margin-bottom: 14px;
      }
      .cs > h4 {
        margin: -8px -12px 8px;
        padding: 7px 12px;
        font-size: 13px;
        color: var(--bleu);
        background: var(--bleu-hover);
        border-bottom: 1px solid var(--bord);
        border-radius: 0 6px 0 0;
      }
      .cs > h4 small {
        font-weight: 400;
        color: var(--muet);
      }
      .cs.adv {
        border-left-color: #8d533e;
      }
      .cs.adv > h4 {
        color: #8d533e;
        background: #fbf5f2;
      }
      .pick {
        border: 1px solid var(--bord);
        border-radius: 4px;
        max-height: 200px;
        overflow: auto;
        padding: 4px 8px;
        background: var(--carte);
      }
      .pick label.dis {
        color: #aaa;
      }
      .chosen {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .chosen li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border: 1px solid var(--bord);
        border-radius: 4px;
        background: #fcfcff;
      }
      .chosen li > span {
        font-weight: 700;
      }
      .chosen .ctrls {
        flex-basis: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 2px 14px;
        font-size: 12px;
        color: var(--muet);
      }
      .chosen .ctrls label {
        margin: 1px 0;
      }
      .chosen .ctrls select {
        font-size: 12px;
      }
      .chosen .fl {
        flex-basis: 100%;
        font-size: 11px;
        color: var(--muet);
      }
      .preview {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-auto-rows: 22px;
        gap: 3px;
        background: var(--fond);
        padding: 4px;
        border-radius: 4px;

      .preview.dense {
        grid-auto-flow: row dense;
      }
      .preview.flux {

        flex-wrap: wrap;
      }
      .preview div {
        background: var(--bleu-clair);
        border: 1px solid #b7b7f5;
        border-radius: 3px;
        font-size: 10px;

        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .mrules {
        grid-column: 1 / -1;
        border: 1px dashed var(--bord);

        padding: 4px 8px;

      }
      .mrules .mr {
        display: flex;

        gap: 6px;

      th .ths {

      th .thf:hover {

      th .thf.on {
        color: #fff;

      }
      .fpop {
        position: fixed;
        z-index: 28;
        background: #fff;
        border: 1px solid var(--bord);
        border-radius: 4px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        padding: 6px;
        width: 260px;
        max-height: min(420px, calc(100vh - 8px));
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .fpop ul {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
        flex: 1 1 auto;
        min-height: 60px;
      }
      .fpop li label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 4px;
        cursor: pointer;
        border-radius: 3px;
      }
      .fpop li label:hover {

      }
      .fpop li span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fpop li small {

      .fpop .fbtn {

      @media print {

        }
        body {
          padding: 0;

        #top,

        #rc,

          padding-bottom: 6px;

        }
        #printhead p {

        }
        .bh .tog,
        .bh .max,

        .lyr {
          display: none !important;
        }
        .grid {
          gap: 8px;
        }
        .block {

          max-height: none !important;

    </style>
  </head>
  <body>
    <header id="top">
      <nav id="pnav"></nav>
      <div class="bar">

        <span class="spacer"></span>

    <script>
      "use strict";
      /* ════════════════════════════════════════════════════════════════════════════
   SOMMAIRE DU SCRIPT
   ────────────────────────────────────────────────────────────────────────────
   État et constantes ........ objet S (tout l'état du widget), valeurs par défaut
   Utilitaires ............... esc, parseJSON, toRows, fetchRows (cache des tables)
   Métadonnées ............... loadMeta, getInfo : lecture des vues Grist
   Mise en forme ............. textOf, htmlOf, styles et règles conditionnelles
   Filtres, tri, liaisons .... rowsFor, selectedRowId, linkFor
   Rendu des blocs ........... blockShell, renderTable, renderSingle, renderCards,
                               renderChart (Chart.js), renderAdvChart (Plotly),
                               renderMap (Leaflet : points, QPV, zonages)
   Édition ................... startEdit, saveValue (droits Grist respectés)
   Listes de sélection ....... renderSelectors, synchronisation entre pages
   Rendu principal ........... render() — point central, appelé via scheduleRender()
   Interactions .............. clics, sélection de ligne, plein écran, Disposition
   Export .................... impression / PDF, CSV
   Configuration ............. panneau ⚙ (renderConfig), enregistrement
   Démarrage ................. init(), applyOptions(), abonnements grist.on…

   CYCLE DE VIE
     grist.ready → onOptions → applyOptions → init :
       loadMeta (tables _grist_*) → configurations de W_Composition → menu
       → droits (W_Admin) → render().

     qui regroupe les demandes ; render() abandonne s'il est doublé par un rendu

      /* ---------- État et constantes ---------- */
      // DEFAULTS — options d'une page neuve. KIND — libellé des types de vues Grist (parentKey).
      // SUPPORTED — types affichables. DEFAULT_WIDTH — largeur initiale (en sixièmes) d'un bloc ajouté.
      const DEFAULTS = {
        name: "Page composée",
        title: "",
        blocks: [],
        hideEmptyFields: true,
        hideEmptyBlocks: false,
        tableMaxHeight: 320,
        chartHeight: 260,
      };
      const KIND = {
        record: "Tableau",
        single: "Fiche",
        detail: "Fiches",
        chart: "Graphique",
        custom: "Widget personnalisé",
        form: "Formulaire",

      const DEFAULT_WIDTH = { record: 6, single: 2, detail: 6, chart: 3, custom: 3 };

        "#000091",
        "#009081",
        "#E18B76",
        "#68A532",
        "#A558A0",
        "#C8AA39",
        "#465F9D",
        "#E4794A",
        "#009099",
        "#D1B781",
        "#6A6AF4",
        "#CE614A",

        byId: {}, // données des tables
        sel: {},
        search: {},
        collapsed: {},
        usort: {},
        ufilt: {},
        fieldOpts: new Map(),
        ext: { tableId: null, rowId: null }, // sélection transmise au widget par Grist
        extSel: new Map(), // sélection déduite pour les widgets natifs (listes déroulantes…)

        maps: [],
        mapViews: {},

        optsApplied: false,

      /* ---------- Utilitaires ---------- */

      const esc = (s) =>
        String(s ?? "").replace(

      const isList = (v) => Array.isArray(v) && v[0] === "L";
      // isErr — Erreur de formule Grist : tableau commençant par le marqueur "E".
      const isErr = (v) => Array.isArray(v) && v[0] === "E";

      const isEmpty = (v) => v === null || v === undefined || v === "" || (isList(v) && v.length === 1);

      function toRows(tbl) {

      function fetchRows(tableId) {

            .fetchTable(tableId)
            .then((t) => {
              const rows = toRows(t);
              S.byId[tableId] = new Map(rows.map((r) => [r.id, r]));
              return rows;
            })
            .catch((e) => {
              delete S.cache[tableId];
              throw e;
            });
        }
        return S.cache[tableId];
      }

      /* ---------- Métadonnées de mise en page ---------- */
      async function loadMeta() {
        const names = [
          "_grist_Tables",
          "_grist_Tables_column",
          "_grist_Views",
          "_grist_Pages",
          "_grist_Views_section",
          "_grist_Views_section_field",
          "_grist_Filters",
        ];

          names.map((n) => grist.docApi.fetchTable(n).then(toRows)),

            "Les métadonnées des vues sont vides. Vérifier que le widget a l'accès « complet au document ».",

        m.views = new Map(views.map((v) => [v.id, v]));
        m.sections = new Map(sections.map((s) => [s.id, s]));
        m.sectionsByView = groupBy(
          sections.filter((s) => s.parentId),
          "parentId",

        const pageName = (vid) =>
          m.views.get(vid)?.name ||
          (m.sectionsByView.get(vid) || [])
            .map((s) => s.title)
            .filter(Boolean)
            .slice(0, 2)
            .join(" / ") ||
          `Page n°${vid}`;
        const viewOf = (p) => Number(p.view ?? p.viewRef ?? p.View ?? 0);
        m.pages = pages
          .slice()
          .sort((a, b) => a.pagePos - b.pagePos)
          .map((p) => ({ viewId: viewOf(p), indent: p.indentation || 0 }))
          .filter((p) => p.viewId)
          .map((p) => ({ ...p, name: pageName(p.viewId) }));
        if (!m.pages.length) {
          // repli : vues possédant des widgets
          m.pages = [...m.sectionsByView.keys()]
            .sort((a, b) => a - b)
            .map((vid) => ({ viewId: vid, indent: 0, name: pageName(vid) }));
        }
        m.pageOfView = new Map(m.pages.map((p) => [p.viewId, p.name]));
        // Tables lisibles par l'utilisateur : une table entièrement interdite n'apparaît pas dans listTables
        // (et Grist vide son tableId dans les métadonnées)
        try {
          m.visibleTables = new Set(await grist.docApi.listTables());

        }

          `Diagnostic — _grist_Pages : ${pages.length} lignes, colonnes [${Object.keys(pages[0] || {}).join(", ")}] · ` +
          `_grist_Views : ${views.length} · widgets : ${sections.length} · pages reliées à des widgets : ` +
          `${m.pages.filter((p) => m.sectionsByView.has(p.viewId)).length}`;
        m.fieldsBySection = groupBy(
          fields.slice().sort((a, b) => a.parentPos - b.parentPos),
          "parentId",
        );
        m.filtersBySection = groupBy(filters, "viewSectionRef");
        S.meta = m;
        S.info = new Map();
      }

      function groupCols(tableRef) {
        // colonnes de regroupement d'une table de synthèse : Map(colRef source -> colId)
        const t = S.meta.tables.get(tableRef);
        if (!t?.summarySourceTable) return null;
        return new Map(
          (S.meta.colsByTable.get(tableRef) || [])
            .filter((c) => c.summarySourceCol)
            .map((c) => [c.summarySourceCol, c.colId]),
        );
      }
      // tableLabel — Libellé lisible d'une table (nom de la page qui l'affiche, sinon son identifiant).
      function tableLabel(tableRef) {
        const t = S.meta.tables.get(tableRef);
        if (!t) return "?";
        if (t.summarySourceTable) {
          const src = S.meta.tables.get(t.summarySourceTable)?.tableId || "?";
          return `${src} [${[...(groupCols(tableRef)?.values() || [])].join(", ") || "total"}]`;
        }
        return t.tableId;
      }

      // getInfo — Description complète d'une vue Grist (section) : table, type, champs affichés, tri, filtres, options. Mise en cache.
      function getInfo(secId) {
        if (S.info.has(secId)) return S.info.get(secId);
        const m = S.meta,
          sec = m.sections.get(secId);
        if (!sec) return null;
        const table = m.tables.get(sec.tableRef);
        const fields = (m.fieldsBySection.get(secId) || [])
          .map((f) => {
            const col = m.cols.get(f.colRef);
            if (!col || col.colId.startsWith("gristHelper_")) return null;
            const opts = { ...parseJSON(col.widgetOptions), ...parseJSON(f.widgetOptions) };
            S.fieldOpts.set(f.id, opts);
            return { col, field: f, colId: col.colId, label: col.label || col.colId, opts };
          })
          .filter(Boolean);
        const filters = (m.filtersBySection.get(secId) || [])
          .map((f) => {
            const col = m.cols.get(f.colRef);
            const spec = parseJSON(f.filter, null);
            return col && spec && Object.keys(spec).length ? { col, spec } : null;
          })
          .filter(Boolean);
        const sort = parseJSON(sec.sortColRefs, [])
          .map((x) => {
            const n = parseInt(String(x), 10);
            const col = m.cols.get(Math.abs(n));
            return col ? { col, desc: n < 0, opts: parseJSON(col.widgetOptions) } : null;
          })
          .filter(Boolean);
        const info = {
          sec,
          secId,
          table,
          tableId: table?.tableId,
          kind: sec.parentKey,
          fields,
          filters,
          sort,
          opts: parseJSON(sec.options),
          title: sec.title || tableLabel(sec.tableRef),
        };
        S.info.set(secId, info);
        return info;
      }

      /* ---------- Mise en forme des valeurs ---------- */
      function fmtNum(v, o, t) {
        const min = Math.min(20, Math.max(0, o.decimals ?? 0));
        const max = Math.min(20, Math.max(min, o.maxDecimals ?? (t === "Int" ? 0 : 10)));
        const f = { minimumFractionDigits: min, maximumFractionDigits: max, useGrouping: !!o.numMode };
        if (o.numMode === "percent") f.style = "percent";
        if (o.numMode === "currency") {
          f.style = "currency";
          f.currency = o.currency || "EUR";

        } catch {
          return String(v);
        }

      function refText(col, id, depth) {
        if (!id) return "";
        const row = S.byId[refTarget(col)]?.get(id);
        if (!row) return String(id);
        const vis = col.visibleCol ? S.meta.cols.get(col.visibleCol) : null;
        if (!vis) return `${refTarget(col)}[${id}]`;
        return depth > 2
          ? String(row[vis.colId] ?? "")
          : textOf(vis, parseJSON(vis.widgetOptions), row[vis.colId], depth + 1);

      // textOf — Texte d'une cellule tel que Grist l'afficherait (références, listes, dates, nombres, choix…).
      function textOf(col, opts, v, depth = 0) {

        if (isEmpty(v)) return "";

        switch (t) {
          case "Ref":
            return refText(col, v, depth);
          case "RefList":
            return isList(v)
              ? v
                  .slice(1)
                  .map((id) => refText(col, id, depth))
                  .join(", ")
              : "";
          case "ChoiceList":
            return isList(v) ? v.slice(1).join(", ") : String(v);
          case "Attachments": {
            const n = isList(v) ? v.length - 1 : 0;
            return n ? `${n} pièce${n > 1 ? "s" : ""} jointe${n > 1 ? "s" : ""}` : "";
          }
          case "Bool":
            return v ? "Oui" : "Non";
          case "Date":
            return typeof v === "number"
              ? new Date(v * 1000).toLocaleDateString("fr-FR", { timeZone: "UTC" })
              : String(v);
          case "DateTime":
            return typeof v === "number"
              ? new Date(v * 1000).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })
              : String(v);

          case "Int":
            return typeof v === "number" ? fmtNum(v, opts, t) : String(v);

      function chip(val, opts) {

      function htmlOf(f, v) {

            .slice(1)
            .map((x) => chip(x, f.opts))

            .slice(1)
            .map((id) => `<span class="chip">${rlink(refTarget(f.col), id)}${esc(refText(f.col, id, 0))}</span>`)

      const LINK_SVG =

      const rlink = (table, id) =>
        table && id
          ? `<a class="rlink" data-rt="${esc(table)}" data-rr="${id}" title="Ouvrir la fiche" tabindex="0">${LINK_SVG}</a>`

      /* ---------- Fiche d'un enregistrement référencé (fenêtre superposée) ---------- */
      const rcHist = [];
      // openRecordCard — Ouvre la fiche (vue « carte d'enregistrement » de Grist) d'une ligne référencée, par-dessus la page.
      async function openRecordCard(tableId, rowId, push = true) {
        const tbl = [...S.meta.tables.values()].find((t) => t.tableId === tableId);
        if (!tbl) return;
        await fetchRows(tableId);
        const row = S.byId[tableId]?.get(rowId);
        // fiche « Record card » définie dans Grist pour la table, sinon toutes ses colonnes
        let info = tbl.recordCardViewSectionRef ? getInfo(tbl.recordCardViewSectionRef) : null;
        if (!info || !info.fields.length) {
          const cols = (S.meta.colsByTable.get(tbl.id) || []).filter(
            (c) => !c.colId.startsWith("gristHelper_") && c.colId !== "manualSort",
          );
          info = {
            secId: -tbl.id,
            tableId,
            sec: {},
            opts: {},
            fields: cols.map((col) => ({
              col,
              colId: col.colId,
              label: col.label || col.colId,
              opts: parseJSON(col.widgetOptions),
            })),
          };

        await ensureRefTables(info.fields.map((f) => f.col));

          (S.meta.colsByTable.get(tbl.id) || []).find((c) => /^(nom|name|libell|titre)/i.test(c.colId)) ||

      // isNumCol — Colonne numérique (alignée à droite, triée comme un nombre).

      /* ---------- Mise en forme Grist (styles de cellule, règles conditionnelles) ---------- */
      function refList(v) {

      function applyRules(base, rules, rulesOptions, row) {

        // la règle la plus haute dans la liste l'emporte : on applique de bas en haut
        for (let i = rules.length - 1; i >= 0; i--) {

          if (rc && row[rc.colId] === true)
            for (const k of STYLE_KEYS)

      function styleCss(st, bgOnly = false) {
